name: Publicar staging (teste interno)

# Build de teste: toda vez que algo muda em main, sobe automaticamente em
# /staging/ no mesmo domínio da VPS (sem afetar o site de produção, que mora
# na raiz). É o ambiente que a aba "Teste interno" do admin abre no iframe.
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tailwind.config.js'
      - 'postcss.config.js'
      - '.github/workflows/deploy-staging.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Conexão com a nuvem
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::Cadastre VITE_SUPABASE_URL e VITE_SUPABASE_ANON_KEY em Settings > Secrets and variables > Actions."
            exit 1
          fi
          printf 'VITE_SUPABASE_URL=%s\nVITE_SUPABASE_ANON_KEY=%s\n' "$VITE_SUPABASE_URL" "$VITE_SUPABASE_ANON_KEY" > .env

      - run: npm ci

      - name: Sincronizar versão mais recente do app (Staging à frente da produção)
        run: |
          node -e '
            const fs = require("fs");
            const https = require("https");
            https.get("https://download.vsstagepro.com.br/mac/manifest.json?t=" + Date.now(), (res) => {
              let d = "";
              res.on("data", c => d += c);
              res.on("end", () => {
                try {
                  const j = JSON.parse(d);
                  const p = JSON.parse(fs.readFileSync("desktop/package.json", "utf8"));
                  const parseV = (v) => v.split(".").map(Number);
                  const sParts = parseV(j.version || "1.0.0");
                  const pParts = parseV(p.version || "1.0.0");
                  const cmp = (a, b) => {
                    for (let i = 0; i < 3; i++) {
                      if ((a[i] || 0) > (b[i] || 0)) return 1;
                      if ((a[i] || 0) < (b[i] || 0)) return -1;
                    }
                    return 0;
                  };
                  // O staging deve sempre estar à frente da produção para refletir o código mais recente em teste
                  let targetParts = cmp(pParts, sParts) > 0 ? pParts : sParts;
                  if (cmp(targetParts, sParts) <= 0) {
                    targetParts = [...sParts];
                    targetParts[2] += 1;
                  }
                  p.version = targetParts.join(".");
                  fs.writeFileSync("desktop/package.json", JSON.stringify(p, null, 2) + "\n");
                  console.log("Versão do staging sempre à frente da produção:", p.version);
                } catch(e) {}
              });
            }).on("error", () => {});
          ' || true

      - name: Build (base /staging/)
        env:
          VITE_BASE_PATH: /staging/
        run: npm run build

      - name: Publicar dist/ em /staging na VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ] || [ -z "$VPS_SSH_KEY" ]; then
            echo "::error::Cadastre VPS_HOST, VPS_USER e VPS_SSH_KEY em Settings > Secrets and variables > Actions."
            exit 1
          fi
          REMOTE_PATH="/var/www/vsstagepro.com.br/staging"
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_deploy_key
          chmod 600 ~/.ssh/vps_deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/vps_deploy_key "$VPS_USER@$VPS_HOST" "mkdir -p '$REMOTE_PATH'"
          rsync -az --delete -e "ssh -i ~/.ssh/vps_deploy_key" dist/ "$VPS_USER@$VPS_HOST:$REMOTE_PATH/"
          echo "Staging publicado em $REMOTE_PATH (https://vsstagepro.com.br/staging/)"
