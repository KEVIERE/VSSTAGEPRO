name: Descobrir estrutura da VPS (temporário)

on:
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Conectar e listar pastas
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_deploy_key
          chmod 600 ~/.ssh/vps_deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          echo "=== /var/www ==="
          ssh -i ~/.ssh/vps_deploy_key "$VPS_USER@$VPS_HOST" "ls -la /var/www 2>/dev/null || echo 'sem acesso ou nao existe'"
          echo ""
          echo "=== /home ==="
          ssh -i ~/.ssh/vps_deploy_key "$VPS_USER@$VPS_HOST" "ls -la /home 2>/dev/null || echo 'sem acesso ou nao existe'"
          echo ""
          echo "=== nginx sites (se existir) ==="
          ssh -i ~/.ssh/vps_deploy_key "$VPS_USER@$VPS_HOST" "ls -la /etc/nginx/sites-enabled 2>/dev/null; cat /etc/nginx/sites-enabled/* 2>/dev/null | grep -E 'root|server_name'"
          echo ""
          echo "=== apache vhosts (se existir) ==="
          ssh -i ~/.ssh/vps_deploy_key "$VPS_USER@$VPS_HOST" "grep -rE 'DocumentRoot|ServerName' /etc/apache2/sites-enabled/* 2>/dev/null; true"
          echo ""
          echo "=== quem e o usuario e onde esta o home ==="
          ssh -i ~/.ssh/vps_deploy_key "$VPS_USER@$VPS_HOST" "whoami && pwd && echo '---' && ls -la ~"
          echo ""
          echo "=== teste de escrita em /var/www/vsstagepro.com.br ==="
          ssh -i ~/.ssh/vps_deploy_key "$VPS_USER@$VPS_HOST" "touch /var/www/vsstagepro.com.br/.write_test 2>&1 && echo 'OK: pode escrever' && rm -f /var/www/vsstagepro.com.br/.write_test || echo 'FALHOU: sem permissao de escrita'"
          echo ""
          echo "=== rsync instalado? ==="
          ssh -i ~/.ssh/vps_deploy_key "$VPS_USER@$VPS_HOST" "which rsync || echo 'rsync nao encontrado'"
          echo ""
          echo "=== dono real da pasta (numeros) ==="
          ssh -i ~/.ssh/vps_deploy_key "$VPS_USER@$VPS_HOST" "stat -c '%U:%G (%u:%g)' /var/www/vsstagepro.com.br 2>/dev/null || stat -f '%Su:%Sg' /var/www/vsstagepro.com.br"
          echo ""
          echo "=== sudo sem senha funciona? ==="
          ssh -i ~/.ssh/vps_deploy_key "$VPS_USER@$VPS_HOST" "sudo -n true 2>&1 && echo 'OK: sudo sem senha funciona' || echo 'FALHOU: sudo pede senha ou nao e permitido'"
          echo ""
          echo "=== grupos do usuario ==="
          ssh -i ~/.ssh/vps_deploy_key "$VPS_USER@$VPS_HOST" "id"
