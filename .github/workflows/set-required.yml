name: Marcar versão como obrigatória/opcional

# Ferramenta de emergência: ajusta o campo "required" do manifest.json já publicado,
# sem precisar gerar um novo build. Atualiza os dois destinos (VPS e bucket Supabase
# app-downloads) para nunca ficarem fora de sincronia entre si.
on:
  workflow_dispatch:
    inputs:
      required:
        description: 'Marcar como obrigatória? (true/false)'
        required: true
        default: 'true'
        type: choice
        options: ['true', 'false']

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Atualizar manifest na VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          REQUIRED: ${{ inputs.required }}
        run: |
          REMOTE_BASE="/var/www/download.vsstagepro.com.br"
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_deploy_key
          chmod 600 ~/.ssh/vps_deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          PYBOOL="False"; [ "$REQUIRED" = "true" ] && PYBOOL="True"
          CMD="python3 -c \"import json; p='$REMOTE_BASE/mac/manifest.json'; m=json.load(open(p)); m['required']=$PYBOOL; json.dump(m, open(p,'w')); print('required agora:', m['required'], '-', m['version'], 'build', m['build'])\""
          ssh -i ~/.ssh/vps_deploy_key "$VPS_USER@$VPS_HOST" "$CMD"
          scp -i ~/.ssh/vps_deploy_key "$VPS_USER@$VPS_HOST:$REMOTE_BASE/mac/manifest.json" manifest.json

      # Mesmo manifest (já com o "required" atualizado) espelhado no bucket Supabase
      # app-downloads, para os dois destinos nunca ficarem fora de sincronia.
      - name: Atualizar manifest no Supabase
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::warning::Cadastre SUPABASE_SERVICE_ROLE_KEY para também espelhar no bucket app-downloads."
            exit 0
          fi
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -H "x-upsert: true" \
            --data-binary "@manifest.json" \
            "$SUPABASE_URL/storage/v1/object/app-downloads/mac/manifest.json" > /dev/null
