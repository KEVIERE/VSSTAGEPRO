name: Publicar site (VPS)

# Produção: só publica quando alguém pede explicitamente — manualmente aqui, pelo botão
# "Upgrade de produção" do admin (aba Teste interno, que dispara promote-production.yml),
# ou como parte desse workflow (workflow_call). Deixou de disparar sozinho a cada push:
# isso agora é só o staging (ver deploy-staging.yml), pra dar espaço de teste antes de
# publicar pra todo mundo.
on:
  workflow_dispatch:
  workflow_call:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Conexão com a nuvem
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::Cadastre VITE_SUPABASE_URL e VITE_SUPABASE_ANON_KEY em Settings > Secrets and variables > Actions."
            exit 1
          fi
          printf 'VITE_SUPABASE_URL=%s\nVITE_SUPABASE_ANON_KEY=%s\n' "$VITE_SUPABASE_URL" "$VITE_SUPABASE_ANON_KEY" > .env

      - run: npm ci
      - run: npm run build

      - name: Publicar dist/ na VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ] || [ -z "$VPS_SSH_KEY" ]; then
            echo "::error::Cadastre VPS_HOST, VPS_USER e VPS_SSH_KEY em Settings > Secrets and variables > Actions."
            exit 1
          fi
          REMOTE_PATH="/var/www/vsstagepro.com.br"
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_deploy_key
          chmod 600 ~/.ssh/vps_deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          # Nunca apaga a pasta staging/ da VPS (ambiente de teste interno)
          rsync -az --delete --exclude 'staging' --exclude 'staging/**' -e "ssh -i ~/.ssh/vps_deploy_key" dist/ "$VPS_USER@$VPS_HOST:$REMOTE_PATH/"
          echo "Site publicado em $REMOTE_PATH"
