<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
<title>VS Stage Pro</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; cursor: default; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  .card {
    position: absolute; inset: 0; border-radius: 22px;
    background: linear-gradient(180deg, rgba(36, 38, 43, 0.55) 0%, rgba(12, 13, 16, 0.72) 100%);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.09), inset 0 1px 0 rgba(255, 255, 255, 0.12);
    animation: cardIn 520ms cubic-bezier(0.22, 1, 0.36, 1) both;
    transition: opacity 420ms ease, transform 420ms ease;
  }
  .leaving .card { opacity: 0; transform: scale(1.03); }
  svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .logo-pop { transform-box: fill-box; transform-origin: center; animation: logoPop 850ms cubic-bezier(0.16, 1, 0.3, 1) both; }
  .stage-aura { transform-box: fill-box; transform-origin: center; animation: auraPulse 3s ease-in-out infinite alternate; }
  .wave-draw {
    stroke-dasharray: 1; stroke-dashoffset: 1;
    animation: waveDraw 950ms cubic-bezier(0.25, 1, 0.5, 1) 300ms forwards, waveGlow 2.8s ease-in-out 1250ms infinite alternate;
  }
  .wave-core-draw {
    stroke-dasharray: 1; stroke-dashoffset: 1;
    animation: waveDraw 900ms cubic-bezier(0.25, 1, 0.5, 1) 350ms forwards;
  }
  .play-pop {
    transform-box: fill-box; transform-origin: 48% 50%;
    animation: playSpring 850ms cubic-bezier(0.34, 1.5, 0.64, 1) 750ms both, playGleam 3s ease-in-out 1600ms infinite alternate;
  }
  .timeline-grid { animation: timelineFade 1s ease-out 150ms both; }
  .playhead-sweep { animation: playheadPulse 2s ease-in-out infinite alternate; }
  .title-cinematic { animation: titleCinematic 950ms cubic-bezier(0.16, 1, 0.3, 1) 900ms both; }
  .rise { animation: rise 600ms ease-out both; }
  .status { animation: fade 300ms ease-out both; }
  #bar { transform-box: fill-box; transform-origin: left center; transform: scaleX(0.04); transition: transform 700ms cubic-bezier(0.22, 1, 0.36, 1); }
  @keyframes cardIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
  @keyframes logoPop { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
  @keyframes auraPulse { 0% { opacity: 0.3; transform: scale(0.92); } 50% { opacity: 0.8; transform: scale(1.08); filter: drop-shadow(0 0 25px rgba(255, 159, 10, 0.4)); } 100% { opacity: 0.4; transform: scale(1); } }
  @keyframes waveDraw { from { stroke-dashoffset: 1; opacity: 0.2; } to { stroke-dashoffset: 0; opacity: 1; } }
  @keyframes waveGlow {
    0% { opacity: 0.88; filter: drop-shadow(0 0 14px rgba(74, 222, 128, 0.6)); }
    50% { opacity: 1; filter: drop-shadow(0 0 28px rgba(59, 130, 246, 0.9)) drop-shadow(0 0 40px rgba(245, 158, 11, 0.8)); }
    100% { opacity: 0.92; filter: drop-shadow(0 0 18px rgba(245, 158, 11, 0.7)); }
  }
  @keyframes playSpring {
    0% { opacity: 0; transform: scale(0.25); }
    70% { opacity: 1; transform: scale(1.08); }
    100% { opacity: 1; transform: scale(1); }
  }
  @keyframes playGleam {
    0% { filter: drop-shadow(0 20px 24px rgba(0, 0, 0, 0.85)); }
    100% { filter: drop-shadow(0 20px 24px rgba(0, 0, 0, 0.85)) drop-shadow(0 0 16px rgba(255, 255, 255, 0.45)); }
  }
  @keyframes timelineFade { from { opacity: 0; transform: scaleY(0.7); } to { opacity: 0.35; transform: scaleY(1); } }
  @keyframes playheadPulse { 0% { opacity: 0.2; stroke-width: 2.5; } 50% { opacity: 0.9; stroke-width: 4.5; filter: drop-shadow(0 0 8px #ff9f0a); } 100% { opacity: 0.35; stroke-width: 3; } }
  @keyframes titleCinematic { from { opacity: 0; letter-spacing: 12px; transform: translateY(6px); } to { opacity: 1; letter-spacing: 4px; transform: translateY(0); } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="card">
  <svg viewBox="0 0 560 380" preserveAspectRatio="xMidYMid meet">
    <defs>
      <linearGradient id="stageBg" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#1C1D22" />
        <stop offset="100%" stop-color="#0E0F12" />
      </linearGradient>

      <linearGradient id="stageBorder" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#363942" />
        <stop offset="100%" stop-color="#16171B" />
      </linearGradient>

      <linearGradient id="waveGrad" x1="0%" y1="50%" x2="100%" y2="50%">
        <stop offset="0%" stop-color="#4ADE80" />
        <stop offset="28%" stop-color="#10B981" />
        <stop offset="55%" stop-color="#3B82F6" />
        <stop offset="78%" stop-color="#F59E0B" />
        <stop offset="100%" stop-color="#EA580C" />
      </linearGradient>

      <linearGradient id="playFill" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22" />
        <stop offset="50%" stop-color="#272932" stop-opacity="0.78" />
        <stop offset="100%" stop-color="#121318" stop-opacity="0.92" />
      </linearGradient>

      <linearGradient id="playStroke" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
        <stop offset="60%" stop-color="#A1A1AA" stop-opacity="0.6" />
        <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.85" />
      </linearGradient>

      <filter id="waveGlow" x="-25%" y="-25%" width="150%" height="150%">
        <feGaussianBlur stdDeviation="20" result="blur" />
        <feMerge>
          <feMergeNode in="blur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>

      <filter id="playDropShadow" x="-25%" y="-25%" width="150%" height="150%">
        <feDropShadow dx="0" dy="24" stdDeviation="20" flood-color="#000000" flood-opacity="0.8" />
      </filter>
      <filter id="barGlow" x="-20%" y="-200%" width="140%" height="500%"><feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#4ade80" flood-opacity="0.6" /></filter>
      <radialGradient id="stageAura" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#ff9f0a" stop-opacity="0.4" />
        <stop offset="40%" stop-color="#10b981" stop-opacity="0.2" />
        <stop offset="70%" stop-color="#0a84ff" stop-opacity="0.08" />
        <stop offset="100%" stop-color="#0a84ff" stop-opacity="0" />
      </radialGradient>
    </defs>

    <!-- Aura de Holofote Atrás do Logo -->
    <circle cx="280" cy="98" r="110" fill="url(#stageAura)" class="stage-aura" />

    <!-- Logo Oficial Centralizado em 560x380 (x=210, y=28, 140x140) -->
    <svg x="210" y="28" width="140" height="140" viewBox="0 0 1024 1024" class="logo-pop" overflow="visible">
      <rect x="32" y="32" width="960" height="960" rx="216" ry="216" fill="url(#stageBg)" stroke="url(#stageBorder)" stroke-width="10" />

      <g class="timeline-grid" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="2">
        <line x1="212" y1="80" x2="212" y2="944" />
        <line x1="362" y1="80" x2="362" y2="944" />
        <line x1="512" y1="80" x2="512" y2="944" />
        <line x1="662" y1="80" x2="662" y2="944" />
        <line x1="812" y1="80" x2="812" y2="944" />
      </g>

      <line class="playhead-sweep" x1="382" y1="140" x2="382" y2="884" stroke="#F59E0B" stroke-width="3.5" stroke-opacity="0.45" stroke-dasharray="8 8" />

      <path
        class="wave-draw"
        pathLength="1"
        d="M 164 512 C 230 512, 285 268, 368 268 C 455 268, 555 756, 648 756 C 732 756, 785 512, 860 512"
        fill="none"
        stroke="url(#waveGrad)"
        stroke-width="54"
        stroke-linecap="round"
        filter="url(#waveGlow)"
      />

      <path
        class="wave-core-draw"
        pathLength="1"
        d="M 164 512 C 230 512, 285 268, 368 268 C 455 268, 555 756, 648 756 C 732 756, 785 512, 860 512"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="10"
        stroke-linecap="round"
        opacity="0.55"
      />

      <g class="play-pop" filter="url(#playDropShadow)">
        <path
          d="M 382 324 C 382 298, 410 282, 432 295 L 704 459 C 726 472, 726 504, 704 517 L 432 681 C 410 694, 382 678, 382 652 Z"
          fill="url(#playFill)"
          stroke="url(#playStroke)"
          stroke-width="28"
          stroke-linejoin="round"
        />
      </g>
    </svg>

    <text id="title" class="title-cinematic" x="280" y="212" text-anchor="middle" font-size="26" font-weight="800" fill="#fff" letter-spacing="4"></text>
    <text class="rise" style="animation-delay: 1400ms" x="280" y="234" text-anchor="middle" font-size="10" font-weight="600" fill="#9ca3af" letter-spacing="4">LIVE PERFORMANCE ENGINE</text>
    <g class="fade" style="animation-delay: 500ms">
      <text id="status" class="status" x="280" y="270" text-anchor="middle" font-size="11" fill="#a1a8b3">Carregando motor de áudio...</text>
      <g transform="translate(150, 285)">
        <rect width="260" height="6" rx="3" fill="rgba(0,0,0,0.45)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
        <rect id="bar" x="1" y="1" width="258" height="4" rx="2" fill="#4ade80" filter="url(#barGlow)" />
      </g>
    </g>
    <g class="fade" style="animation-delay: 800ms">
      <text x="24" y="356" font-size="10" font-weight="500" fill="#71717a">© 2026 VS Stage Pro</text>
      <text x="536" y="356" text-anchor="end" font-size="10" font-weight="600" fill="#f59e0b" id="version"></text>
    </g>
  </svg>
</div>
<script>
  const NS = 'http://www.w3.org/2000/svg';
  const title = document.getElementById('title');
  'VS STAGE'.split('').forEach((ch, i) => {
    const t = document.createElementNS(NS, 'tspan');
    t.setAttribute('class', 'letter');
    t.style.animationDelay = (900 + i * 55) + 'ms';
    t.textContent = ch;
    title.appendChild(t);
  });
  const version = new URLSearchParams(location.search).get('v');
  if (version) document.getElementById('version').textContent = 'v' + version + ' PRO';
  const status = document.getElementById('status');
  const bar = document.getElementById('bar');
  const steps = [
    [0, 0.18, 'Carregando motor de áudio...'],
    [750, 0.52, 'Preparando timecode e periféricos...'],
    [1500, 0.84, 'Abrindo o show...'],
  ];
  const setStep = (progress, text) => {
    bar.style.transform = 'scaleX(' + progress + ')';
    if (status.textContent !== text) {
      status.textContent = text;
      status.classList.remove('status');
      void status.getBBox();
      status.classList.add('status');
    }
  };
  steps.forEach(([at, p, text]) => setTimeout(() => setStep(p, text), at + 60));
  const skip = () => { location.href = 'about:blank#skip'; };
  window.addEventListener('mousedown', skip);
  window.addEventListener('keydown', skip);
  window.addEventListener('message', (e) => {
    if (e.data !== 'vs:leave') return;
    setStep(1, 'Pronto');
    setTimeout(() => document.body.classList.add('leaving'), 180);
  });
</script>
</body>
</html>
