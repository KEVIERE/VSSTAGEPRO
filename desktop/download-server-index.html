<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VS Stage — Servidor de downloads</title>
<meta name="robots" content="noindex">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: radial-gradient(ellipse at top, #1b1c20 0%, #0a0b0d 70%);
    color: #e8e8e8; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem;
  }
  .card { width: 100%; max-width: 420px; text-align: center; animation: fadeIn .3s ease-out; }
  .logo { width: 72px; height: 72px; margin: 0 auto 20px; display: block; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #30d158; margin-right: 7px; vertical-align: middle; }
  .label { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: #888; margin-bottom: 10px; }
  h1 { font-size: 22px; font-weight: 600; margin-bottom: 10px; }
  p { font-size: 13px; color: #999; line-height: 1.6; }
  a.btn {
    display: inline-flex; align-items: center; gap: 8px; margin-top: 22px; padding: 11px 20px; border-radius: 10px;
    font-size: 13px; font-weight: 600; background: #30d158; color: #000; text-decoration: none;
    transition: filter .2s;
  }
  a.btn:hover { filter: brightness(1.1); }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
</style>
</head>
<body>
<div class="card">
  <svg class="logo" viewBox="0 0 100 100" aria-hidden="true">
    <defs>
      <linearGradient id="g1" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#22242a" /><stop offset="100%" stop-color="#0f1013" />
      </linearGradient>
      <radialGradient id="g2" cx="45%" cy="30%" r="65%">
        <stop offset="0%" stop-color="#555861" /><stop offset="35%" stop-color="#15171c" />
        <stop offset="85%" stop-color="#000" /><stop offset="100%" stop-color="#030303" />
      </radialGradient>
      <filter id="neon" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="1.8" result="b1" /><feGaussianBlur stdDeviation="3.5" result="b2" />
        <feMerge><feMergeNode in="b2" /><feMergeNode in="b1" /><feMergeNode in="SourceGraphic" /></feMerge>
      </filter>
    </defs>
    <rect x="1" y="1" width="98" height="98" rx="24" fill="url(#g1)" stroke="#2c2f38" stroke-width="1" />
    <circle cx="50" cy="50" r="25" fill="url(#g2)" />
    <g transform="rotate(22 50 50)"><path d="M 9 50 A 41 10 0 0 0 91 50" fill="none" stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round" filter="url(#neon)" /></g>
    <g transform="rotate(-18 50 50)"><path d="M 2 50 A 48 12 0 0 0 98 50" fill="none" stroke="#22c55e" stroke-width="1.8" stroke-linecap="round" filter="url(#neon)" /></g>
    <polygon points="46,42 59,50 46,58" fill="#fff" stroke-linejoin="round" />
  </svg>
  <div class="label"><span class="dot"></span>VS STAGE</div>
  <h1>Servidor de downloads</h1>
  <p>Esta é a área interna que entrega os instaladores do VS Stage ao aplicativo e ao site. Para baixar o programa, use a página oficial.</p>
  <a class="btn" href="https://vsstagepro.com.br/baixar">Ir para a página de download</a>
</div>
</body>
</html>
