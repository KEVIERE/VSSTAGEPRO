[auth]
site_url = "https://vsstagepro.com.br"
additional_redirect_urls = ["https://vsstagepro.com.br/**", "https://www.vsstagepro.com.br/**", "vsstage://**"]

[auth.email.smtp]
enabled = true
host = "smtp.resend.com"
port = 465
user = "resend"
pass = "env(RESEND_SMTP_PASS)"
admin_email = "noreply@vsstagepro.com.br"
sender_name = "VS Stage Pro"

[auth.email.template.confirmation]
subject = "Confirme seu e-mail — VS Stage Pro"
content_path = "./supabase/email-templates/confirmation.html"

[auth.email.template.recovery]
subject = "Redefinir sua senha — VS Stage Pro"
content_path = "./supabase/email-templates/recovery.html"

[auth.email.template.email_change]
subject = "Confirme seu novo e-mail — VS Stage Pro"
content_path = "./supabase/email-templates/email_change.html"

[auth.email.template.magic_link]
subject = "Seu link de acesso — VS Stage Pro"
content_path = "./supabase/email-templates/magic_link.html"

[functions.admin-releases]
verify_jwt = true

[functions.admin-promote]
verify_jwt = true

[functions.admin-coupons]
verify_jwt = true

[functions.prompter-audio]
verify_jwt = true

[functions.stripe-checkout]
verify_jwt = true

[functions.stripe-webhook]
verify_jwt = false

[functions.signup-phone]
verify_jwt = false

[functions.telegram-alert]
verify_jwt = false

[functions.app-heartbeat]
verify_jwt = false

[functions.health-check]
verify_jwt = false
