<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>O worklet toca 44,1k a 48k?</title>
<style>
  body { font: 14px/1.5 -apple-system, system-ui, sans-serif; padding: 24px; background: #17181c; color: #e8e9ed; }
  pre { background: #202127; padding: 14px; border-radius: 8px; white-space: pre-wrap; }
  .ok { color: #45c07a; } .ruim { color: #e05a4f; } .aviso { color: #f0a92c; }
</style>
</head>
<body>
<h1>Um áudio de 44,1 kHz toca na velocidade certa dentro de um worklet de 48 kHz?</h1>
<p>Este teste usa só o <b>AudioContext normal</b> do navegador, que é o mesmo caminho do app.</p>
<pre id="saida">rodando...</pre>
<script>
const saida = document.getElementById('saida');
const L = [];
const log = (t, c) => { L.push(c ? `<span class="${c}">${t}</span>` : t); saida.innerHTML = L.join('\n'); };

// Cria um AudioBuffer de 44100 Hz com dois impulsos: em 1 s e em 10 s.
function criarBuffer(ctx, sr, posicoes, duracao) {
  const n = Math.round(sr * duracao);
  const b = ctx.createBuffer(2, n, sr);
  const larg = Math.round(0.003 * sr);
  for (let c = 0; c < 2; c++) {
    const d = b.getChannelData(c);
    for (const p of posicoes) {
      const inicio = Math.round(p * sr);
      for (let i = 0; i < larg; i++) d[inicio + i] = Math.sin(i / larg * Math.PI) * 0.9;
    }
  }
  return b;
}

function acharPicos(dados, esperados, sr) {
  const achados = [];
  const janela = Math.round(0.05 * sr);
  for (const esperado of esperados) {
    const centro = Math.round(esperado * sr);
    let maior = 0, pos = centro;
    for (let i = Math.max(0, centro - janela); i < Math.min(dados.length, centro + janela); i++) {
      const a = Math.abs(dados[i]);
      if (a > maior) { maior = a; pos = i; }
    }
    achados.push({ esperado, pos, valor: maior });
  }
  return achados;
}

async function testar() {
  const ctx = new AudioContext();
  const srCtx = ctx.sampleRate;
  log(`taxa do AudioContext: ${srCtx} Hz`);
  const POS = [1, 10];
  const DUR = 30;

  // 1. Toca um buffer de 44100 Hz e captura o resultado com um AnalyserNode? Não dá precisão.
  // Melhor: renderiza num OfflineAudioContext de 48000 (que é como o worklet roda) e olha.
  const off = new OfflineAudioContext(2, Math.round(srCtx * DUR), srCtx);
  const buf = criarBuffer(off, 44100, POS, DUR);
  log(`buffer criado a ${buf.sampleRate} Hz, ${buf.length} amostras, ${buf.duration.toFixed(4)} s`);

  const src = off.createBufferSource();
  src.buffer = buf;
  src.connect(off.destination);
  src.start();

  const out = await off.startRendering();
  log(`renderizado a ${out.sampleRate} Hz, ${out.length} amostras`);
  const picos = acharPicos(out.getChannelData(0), POS, srCtx);
  log('');
  for (const p of picos) {
    const ms = (p.pos - p.esperado * srCtx) / srCtx * 1000;
    log(`impulso esperado em ${p.esperado} s → achado em ${(p.pos / srCtx).toFixed(6)} s  (${ms >= 0 ? '+' : ''}${ms.toFixed(2)} ms)`,
        Math.abs(ms) > 5 ? 'ruim' : 'ok');
  }

  log('');
  log('Um BufferSource do Web Audio reamostra sozinho, então isto deve dar 0 ms.');
  log('O app NÃO usa BufferSource: usa um AudioWorklet que lê 1 amostra por frame de saída.', 'aviso');
  log('');
  log('Se o worklet roda a ' + srCtx + ' e lê 1:1 um áudio de 44100, a música inteira', 'aviso');
  log(`termina em ${DUR} * 44100/48000 = ${(DUR * 44100 / 48000).toFixed(2)} s — ${((DUR - DUR*44100/48000)).toFixed(2)} s mais cedo.`, 'aviso');
  const deriva100s = 100 * (1 - 44100 / 48000) * 1000;
  log(`Deriva ao longo de 1:40: ${deriva100s.toFixed(0)} ms por minuto de música.`, 'ruim');
}

testar().catch((e) => log('ERRO: ' + e.message, 'ruim'));
</script>
</body>
</html>
